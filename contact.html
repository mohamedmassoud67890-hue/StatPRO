<!DOCTYPE html>
<html lang="fr" style="scroll-behavior: smooth;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiques Pro | Contact</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* الأساسيات */
        :root {
            --primary: #2563eb; --primary-dark: #1e40af; --primary-light: #eff6ff;
            --text-dark: #0f172a; --text-gray: #475569; --bg-body: #f8fafc; --bg-white: #ffffff;
            --border-color: #e2e8f0; --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-dark); }
        h1, h2, h3 { font-family: 'Poppins', sans-serif; }
        a { text-decoration: none; color: inherit; }
        .container { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
        
        /* Navbar */
        .navbar { background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); position: fixed; top: 0; width: 100%; z-index: 1000; border-bottom: 1px solid var(--border-color); padding: 15px 0; }
        .nav-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.8rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .nav-links { display: flex; gap: 30px; align-items: center; }
        .nav-links a { font-weight: 600; color: var(--text-gray); }
        .btn-contact-nav { background-color: var(--primary); color: white !important; padding: 10px 24px; border-radius: 50px; }

        /* Hero */
        .page-hero { padding: 140px 0 80px; background: linear-gradient(135deg, var(--bg-white) 0%, var(--primary-light) 100%); text-align: center; border-bottom: 1px solid var(--border-color); }
        .page-title { font-size: 3rem; color: var(--text-dark); margin-bottom: 15px; }
        
        /* Form Box */
        .contact-wrapper { max-width: 700px; margin: -40px auto 100px; background: var(--bg-white); padding: 50px; border-radius: 20px; box-shadow: var(--shadow-md); border: 1px solid var(--border-color); position: relative; z-index: 10; }
        
        /* Info Cards التعديلات الجديدة هنا لجعلها قابلة للضغط وتتفاعل عند تمرير الماوس */
        .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 40px; }
        .info-card { display: block; background: var(--bg-body); padding: 20px; border-radius: 15px; text-align: center; border: 1px solid var(--border-color); transition: var(--transition); cursor: pointer; }
        .info-card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: var(--shadow-md); background: var(--bg-white); }
        .info-card i { font-size: 2rem; color: var(--primary); margin-bottom: 10px; transition: var(--transition); }
        .info-card:hover i { transform: scale(1.1); }
        
        /* Form Styling */
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-dark); }
        .form-group input, .form-group textarea { width: 100%; padding: 15px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 1rem; outline: none; transition: var(--transition); background-color: var(--bg-body); }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); background-color: var(--bg-white); }
        .btn-submit { width: 100%; background-color: var(--primary); color: white; padding: 15px; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: var(--transition); display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-submit:hover { background-color: var(--primary-dark); transform: translateY(-2px); }
        
        footer { background-color: #020617; color: #94a3b8; text-align: center; padding: 30px 0; font-size: 0.9rem; }
        @media (max-width: 768px) { .nav-links { display: none; } .info-grid { grid-template-columns: 1fr; } .contact-wrapper{ padding: 30px;} }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo"><i class="fas fa-chart-pie"></i> StatPRO.</a>
            <div class="nav-links">
                <a href="index.html">Accueil</a>
                <a href="index.html#outils">Outils</a>
            </div>
        </div>
    </nav>

    <section class="page-hero">
        <div class="container">
            <h1 class="page-title">Contactez-<span>Nous</span></h1>
            <p style="color: var(--text-gray); font-size: 1.1rem;">Une question ? Une suggestion d'outil ? Écrivez-nous.</p>
        </div>
    </section>

    <div class="container">
        <div class="contact-wrapper">
            <div class="info-grid">
                <a href="mailto:mohamedmassoud@gmail.com" class="info-card">
                    <i class="fas fa-envelope"></i>
                    <h3>Email</h3>
                    <p style="color: var(--text-gray); font-size: 0.9rem;">mohamedmassoud@gmail.com</p>
                </a>
                <a href="https://instagram.com/massoud0.3" target="_blank" class="info-card">
                    <i class="fab fa-instagram"></i>
                    <h3>Instagram</h3>
                    <p style="color: var(--text-gray); font-size: 0.9rem;">@massoud0.3</p>
                </a>
            </div>

            <form action="https://formsubmit.co/mohamedmassoud@gmail.com" method="POST">
                
                <input type="hidden" name="_subject" value="Nouveau message depuis StatPRO !">
                <input type="hidden" name="_captcha" value="false"> <div class="form-group">
                    <label>Nom complet</label>
                    <input type="text" name="Nom" placeholder="Votre nom" required>
                </div>
                <div class="form-group">
                    <label>Adresse e-mail</label>
                    <input type="email" name="Email" placeholder="email@exemple.com" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea rows="5" name="Message" placeholder="Comment pouvons-nous vous aider ?" required></textarea>
                </div>
                <button type="submit" class="btn-submit">
                    Envoyer le message <i class="fas fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </div>

    <footer>
        <div class="container">
            <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-bottom: 20px;">
                <a href="a-propos.html" style="color: #cbd5e1;">À Propos</a>
                <a href="contact.html" style="color: #cbd5e1;">Contact</a>
                <a href="cgu.html" style="color: #cbd5e1;">Conditions d'Utilisation</a>
            </div>
            <div style="text-align: center; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
                <p>&copy; 2026 Statistiques Pro. Tous droits réservés.</p>
            </div>
        </div>
    </footer>
</body>
</html>
